name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Built once and shared. The e2e and a11y jobs consume this artifact rather than
  # each running their own `next build` — three identical builds per run otherwise.
  build:
    name: Build
    runs-on: ubuntu-latest
    # Gated on quality: if lint, types, or unit tests fail there is no point building,
    # and no point running browser tests against the result. The pipeline stops here.
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          # .next/cache is local build cache — large and useless to downstream jobs.
          path: |
            .next
            !.next/cache
          retention-days: 1
          include-hidden-files: true

  # Fastest, cheapest checks run first and gate everything downstream.
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:coverage

  e2e:
    name: End-to-end (mocked GitHub API)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # PLAYWRIGHT_PREBUILT skips the build in playwright.config.ts and serves the
      # artifact directly. The GitHub API is intercepted inside the specs — CI runners
      # share IPs and are aggressively rate-limited, so a live API would make this flaky.
      - name: Run Playwright
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PREBUILT: "1"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility checks
        run: npm run test:a11y
        env:
          PLAYWRIGHT_PREBUILT: "1"

  # Security checks are independent of the build chain — they inspect source and
  # dependencies, so they still run (and can still block) if the build fails.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The dependency tree is kept at zero advisories via `overrides` in package.json.
      - name: npm audit
        run: npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3

  # Single aggregate check. Make ONLY this one required in branch protection —
  # it fails unless every job above succeeded, so adding or renaming a job never
  # requires touching repo settings. A required check that no longer exists would
  # otherwise block every PR forever.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [build, quality, e2e, a11y, audit, secrets, codeql]
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          failed=0
          for result in $RESULTS; do
            # Anything other than success — failure, cancelled, or skipped — blocks the PR.
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more required checks did not succeed."
            exit 1
          fi
          echo "All checks passed."
